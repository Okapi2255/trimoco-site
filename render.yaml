# Render Blueprint: Trimoco LLC static site (free static site plan)
services:
  - type: web
    name: trimoco-site
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - {path: /*, name: X-Content-Type-Options, value: nosniff}
      - {path: /*, name: X-Frame-Options, value: SAMEORIGIN}
      - {path: /*, name: Referrer-Policy, value: strict-origin-when-cross-origin}
      - {path: /*, name: Permissions-Policy, value: "camera=(), microphone=(), geolocation=(), payment=()"}
      - {path: /*, name: Strict-Transport-Security, value: "max-age=31536000"}
      - {path: /images/*, name: Cache-Control, value: "public, max-age=2592000"}
      - {path: /fonts/*, name: Cache-Control, value: "public, max-age=31536000, immutable"}
      - {path: /_astro/*, name: Cache-Control, value: "public, max-age=31536000, immutable"}
      - {path: /js/*, name: Cache-Control, value: "public, max-age=86400"}
    routes:
      - {type: redirect, source: /blog, destination: /}
      - {type: redirect, source: /blog/*, destination: /}
      - {type: redirect, source: /projects/kitchen-and-marble-bathroom-renovation/*, destination: /projects/west-village-marble-kitchen-bathroom-renovation/}
      - {type: redirect, source: /projects/kitchen-and-marble-bathroom-renovation, destination: /projects/west-village-marble-kitchen-bathroom-renovation/}
      - {type: redirect, source: /projects/modern-kitchen-and-dining-renovation/*, destination: /projects/upper-west-side-west-end-avenue-kitchen-renovation/}
      - {type: redirect, source: /projects/modern-kitchen-and-dining-renovation, destination: /projects/upper-west-side-west-end-avenue-kitchen-renovation/}
      - {type: redirect, source: /projects/complete-bathroom-renovation/*, destination: /projects/astoria-queens-bathroom-renovation/}
      - {type: redirect, source: /projects/complete-bathroom-renovation, destination: /projects/astoria-queens-bathroom-renovation/}
      - {type: redirect, source: /projects/modern-bathroom-renovation/*, destination: /projects/modern-kitchen-marble-waterfall-island/}
      - {type: redirect, source: /projects/modern-bathroom-renovation, destination: /projects/modern-kitchen-marble-waterfall-island/}
      - {type: redirect, source: /projects/bathroom-renovation-walk-in-shower/*, destination: /projects/soho-manhattan-bathroom-walk-in-shower/}
      - {type: redirect, source: /projects/bathroom-renovation-walk-in-shower, destination: /projects/soho-manhattan-bathroom-walk-in-shower/}
      - {type: redirect, source: /projects/master-bathroom-tile-renovation/*, destination: /projects/90th-street-manhattan-bathroom-tile-renovation/}
      - {type: redirect, source: /projects/master-bathroom-tile-renovation, destination: /projects/90th-street-manhattan-bathroom-tile-renovation/}
