# Daily Places API refresh of trimoco.com Google reviews.
# The Python script no-ops if GOOGLE_PLACES_API_KEY is unset.
# Do not use the secrets context in job/step `if:` — GitHub rejects it
# on workflow_dispatch ("Unrecognized named-value: 'secrets'").
name: Update Google reviews

on:
  schedule:
    - cron: "20 11 * * *" # 6:20 AM America/New_York during EST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Fetch Place Details and update the static reviews
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update reviews from Places API
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python scripts/update_google_reviews.py

      - name: Commit and push only when files changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/google-reviews.json public
          if git diff --staged --quiet; then
            echo "No review changes to commit."
            exit 0
          fi
          git commit -m "Update Google reviews from Places API"
          git push

      # Autodeploy on main has not been reliable (recent deploys were API-triggered).
      # Set RENDER_DEPLOY_HOOK_URL to force a Render deploy after a reviews commit.
      # The hook URL is a secret; do not echo it.
      - name: Trigger Render deploy hook if configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping hook (rely on Render autodeploy or a manual deploy)."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" >/dev/null
