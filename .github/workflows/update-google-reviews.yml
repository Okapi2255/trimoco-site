# Prepared only. Do not merge to main until GOOGLE_PLACES_API_KEY is set.
# Scheduled workflows run only from the default branch, so this file is inert
# on feat/google-reviews-auto-update. The job also no-ops without the key.
name: Update Google reviews

on:
  schedule:
    - cron: "20 11 * * *" # 6:20 AM America/New_York during EST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Fetch Place Details and update the static reviews
    runs-on: ubuntu-latest
    if: ${{ secrets.GOOGLE_PLACES_API_KEY != '' }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update reviews from Places API
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python scripts/update_google_reviews.py

      - name: Commit and push only when files changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/google-reviews.json public
          if git diff --staged --quiet; then
            echo "No review changes to commit."
            exit 0
          fi
          git commit -m "Update Google reviews from Places API"
          git push

      # The Render static service currently has autoDeploy=yes on main, so a
      # push should deploy by itself. Set RENDER_DEPLOY_HOOK_URL only if
      # autodeploy is turned off. The hook URL is a secret; do not echo it.
      - name: Trigger Render deploy hook if configured
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" >/dev/null
